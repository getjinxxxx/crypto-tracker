<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Cards" />
<title>Card Tracker</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #0b0c10; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #f2f2f7; max-width: 720px; margin: 0 auto; padding: 14px 12px calc(150px + env(safe-area-inset-bottom)); line-height: 1.4; }
  body.locked { overflow: hidden; }
  body.shopen { overflow: hidden; }
  #app.hidden { display: none; }

  #lock { position: fixed; inset: 0; background: #0b0c10; z-index: 500; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #lock .lock-card { background: #1b1d26; border: 1px solid #2e313d; border-radius: 18px; padding: 28px 24px; width: 100%; max-width: 340px; text-align: center; }
  #lock .lk-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #lock .lk-sub { color: #a9aebd; font-size: 13px; margin-bottom: 20px; }
  #lock input { width: 100%; background: #12141b; border: 1px solid #3a3e4d; color: #f2f2f7; border-radius: 12px; padding: 13px 14px; font-size: 20px; text-align: center; letter-spacing: 6px; }
  #lock input:focus { outline: none; border-color: #8f8cf5; }
  #lock button { width: 100%; background: #8f8cf5; color: #0f0f1a; border: none; border-radius: 12px; padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px; }
  #lock .lk-err { color: #ff9a9a; font-size: 13px; margin-top: 12px; min-height: 16px; }

  .topbar { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; padding-left: 52px; min-height: 44px; }
  .topbar a, .topbar button { color: #c9ccd8; text-decoration: none; font-size: 13px; border: 1px solid #2e313d; border-radius: 999px; padding: 6px 12px; background: #1b1d26; font-family: inherit; cursor: pointer; }
  .topbar .ttl { font-size: 16px; font-weight: 800; letter-spacing: .4px; flex: 1; }
  .topbar button { font-size: 16px; padding: 5px 11px; }

  .card { background: #1b1d26; border: 1px solid #2e313d; border-left: 4px solid #8f8cf5; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; font-weight: 800; letter-spacing: .8px; color: #cfcffb; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .card h2 .sp { flex: 1; }
  .hint { color: #a9aebd; font-size: 12px; margin: 2px 0 8px; }
  .muted { color: #a9aebd; }
  .grn { color: #34d399; }
  .red { color: #ff9a9a; }

  input[type=text], input[type=date], input[type=search], select {
    background: #12141b; color: #f2f2f7; border: 1px solid #3a3e4d; border-radius: 8px; padding: 9px 10px; font-size: 16px; min-width: 0; font-family: inherit; width: 100%; }
  input:focus, select:focus { outline: none; border-color: #8f8cf5; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: #8f8cf5; flex: none; }
  label.fl { display: block; font-size: 12px; color: #a9aebd; margin: 10px 0 3px; }
  label.ck { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-top: 10px; color: #dfe2ec; }

  button { font-family: inherit; cursor: pointer; }
  .btn { background: #8f8cf5; color: #0f0f1a; border: none; border-radius: 10px; padding: 11px 14px; font-size: 15px; font-weight: 800; }
  .btn.sec { background: #2a2d3c; color: #f2f2f7; border: 1px solid #3a3e4d; font-weight: 700; }
  .btn.dng { background: #3a2327; color: #ffb4b4; border: 1px solid #6b3a40; font-weight: 700; }
  .btn.sm { padding: 7px 10px; font-size: 13px; border-radius: 8px; }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .x { background: transparent; border: 1px solid #3a3e4d; color: #c9ccd8; border-radius: 8px; width: 32px; height: 32px; font-size: 15px; flex: none; }
  .link { background: transparent; border: 1px dashed #5b5f78; color: #cfcffb; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 700; width: 100%; margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chip { background: #23263a; border: 1px solid #3a3e4d; color: #dcdcfb; border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .chip.on { background: #8f8cf5; color: #0f0f1a; border-color: #8f8cf5; font-weight: 800; }
  .sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #3a3e4d; padding: 0; }
  .sw.on { border-color: #ffffff; }
  .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .acts .btn { flex: 1 1 110px; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: #1b1d26; border: 1px solid #2e313d; border-radius: 12px; padding: 10px 12px; }
  .stat.wide { grid-column: 1 / -1; }
  .stat .k { font-size: 11px; font-weight: 800; letter-spacing: .6px; color: #cfcffb; text-transform: uppercase; }
  .stat .v { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: #ffffff; }
  .stat .s { font-size: 12px; color: #a9aebd; }

  .alert { border-radius: 10px; padding: 9px 12px; margin-bottom: 8px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: center; }
  .alert.bad { background: #3a2327; color: #ffb4b4; border: 1px solid #6b3a40; }
  .alert.warn { background: #2b2745; color: #d6d4ff; border: 1px solid #5a55a8; }
  .alert.info { background: #1f2b3a; color: #bfe0ff; border: 1px solid #3a5878; }
  .alert span { flex: 1; }
  .alert button { background: #8f8cf5; color: #0f0f1a; border: none; border-radius: 8px; padding: 6px 10px; font-weight: 800; font-size: 12px; }

  .ctile { background: #1b1d26; border: 1px solid #2e313d; border-left: 6px solid #8f8cf5; border-radius: 12px; padding: 11px 12px; margin-bottom: 10px; cursor: pointer; }
  .ctile.arch { opacity: .65; }
  .ctile .t1 { display: flex; justify-content: space-between; gap: 8px; font-weight: 800; }
  .ctile .t2 { font-size: 12px; color: #a9aebd; margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .ub { height: 8px; background: #2a2d3c; border-radius: 999px; overflow: hidden; margin-top: 8px; }
  .ub i { display: block; height: 100%; background: #34d399; }
  .ub i.hi { background: #ff9a9a; }
  .ub i.bd { background: #8f8cf5; }
  .ub i.wn { background: #c4b5fd; }

  .trow { display: flex; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid #2a2d38; cursor: pointer; }
  .trow:first-child { border-top: none; }
  .trow .l { flex: 1; min-width: 0; }
  .trow .m { font-weight: 700; overflow-wrap: anywhere; }
  .trow .d { font-size: 12px; color: #a9aebd; }
  .trow .a { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .trow.sch .m, .trow.sch .a { color: #a9aebd; font-weight: 600; }
  .trow.skp .m, .trow.skp .a { color: #a9aebd; text-decoration: line-through; font-weight: 600; }
  .tag { display: inline-block; background: #2b2745; color: #d6d4ff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 700; text-decoration: none; }
  .pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 11px; font-weight: 800; }
  .p-Open { background: #2b2745; color: #d6d4ff; }
  .p-Paid { background: #123a2c; color: #34d399; }
  .p-Partial { background: #1c3350; color: #9fd0ff; }
  .p-Upcoming { background: #1f2f3a; color: #7dd3fc; }
  .p-Overdue { background: #4a2227; color: #ffb4b4; }
  .stm { border-top: 1px solid #2a2d38; padding: 10px 0; }
  .stm:first-of-type { border-top: none; }
  .stmc { cursor: pointer; padding: 8px 0; }
  .stmc .r1 b { font-size: 13px; font-weight: 700; }
  .stmc .cv { color: #a9aebd; font-size: 12px; }
  .pgr { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: #a9aebd; }
  .stm .r1 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .stm .r1 b { flex: 1; min-width: 0; }
  .stm .r2 { display: flex; justify-content: space-between; font-size: 13px; color: #dfe2ec; padding: 2px 0; gap: 8px; }
  .stm .r2 b { font-variant-numeric: tabular-nums; }
  .stm .pm { font-size: 12px; color: #a9aebd; display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .stm .pm span { flex: 1; }
  .stm .pm .x { width: 26px; height: 26px; font-size: 12px; }
  .dthead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .dthead .nm { flex: 1; font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }

  .ferr { color: #ff9a9a; font-size: 12px; margin-top: 2px; }
  .filt { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .filt .full { grid-column: 1 / -1; }
  .filt label { font-size: 11px; color: #a9aebd; display: block; margin-bottom: 2px; }

  .bars .br { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; }
  .bars .br .n { width: 34%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dfe2ec; }
  .bars .br .tr { flex: 1; height: 12px; background: #2a2d3c; border-radius: 999px; overflow: hidden; }
  .bars .br .tr i { display: block; height: 100%; background: #8f8cf5; }
  .bars .br .v { width: 96px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
  .trend { display: flex; align-items: flex-end; gap: 8px; height: 150px; padding-top: 6px; }
  .trend .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; }
  .trend .col i { display: block; width: 100%; background: #8f8cf5; border-radius: 6px 6px 0 0; min-height: 2px; }
  .trend .col .tv { font-size: 10px; color: #cfcffb; margin-bottom: 3px; white-space: nowrap; }
  .trend .col .tl { font-size: 11px; color: #a9aebd; margin-top: 4px; }

  #tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; background: #14161d; border-top: 1px solid #2e313d; display: flex; max-width: 720px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
  #tabs button { flex: 1; background: transparent; border: none; color: #a9aebd; padding: 10px 4px 9px; font-size: 12px; font-weight: 700; }
  #tabs button b { display: block; font-size: 18px; line-height: 1.1; }
  #tabs button.on { color: #cfcffb; box-shadow: inset 0 3px 0 #8f8cf5; }
  #fab { position: fixed; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 90; background: #8f8cf5; color: #0f0f1a; border: none; border-radius: 999px; padding: 13px 18px; font-size: 15px; font-weight: 800; box-shadow: 0 4px 14px rgba(0,0,0,.55); }
  body.shopen #fab, body.locked #fab { display: none; }

  #sheet { position: fixed; inset: 0; z-index: 400; display: none; }
  #sheet.on { display: block; }
  #sheet .sh-back { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
  #sheet .sh-box { position: absolute; left: 0; right: 0; bottom: 0; max-width: 720px; margin: 0 auto; max-height: 92vh; overflow-y: auto; background: #1b1d26; border: 1px solid #2e313d; border-radius: 18px 18px 0 0; padding: 16px 14px calc(18px + env(safe-area-inset-bottom)); }
  #sheet h3 { margin: 0 0 6px; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  #sheet h3 span { flex: 1; }
  #sheet .sech { font-size: 12px; font-weight: 800; letter-spacing: .7px; color: #cfcffb; text-transform: uppercase; margin: 16px 0 6px; border-top: 1px solid #2a2d38; padding-top: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .lrow { display: flex; gap: 8px; align-items: center; margin: 6px 0; }
  .lrow input { flex: 1; }
  .lrow .t { flex: 1; min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
  .big { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }

  #toast { position: fixed; left: 12px; right: 12px; bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 700; max-width: 520px; margin: 0 auto; background: #2a2d3c; color: #f2f2f7; border: 1px solid #5b5f78; border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 18px rgba(0,0,0,.6); font-size: 14px; }
  #toast span { flex: 1; }
  #toast button { background: #8f8cf5; color: #0f0f1a; border: none; border-radius: 8px; padding: 7px 12px; font-weight: 800; }
  .foot { text-align: center; color: #8d92a3; font-size: 11px; margin-top: 18px; }
  .empty { color: #a9aebd; font-size: 14px; text-align: center; padding: 18px 8px; }
</style>

    <button type="button" data-tab="home"><b>&#127968;</b>Home</button>
    <button type="button" data-tab="cards"><b>&#128179;</b>Cards</button>
    <button type="button" data-tab="txns"><b>&#129534;</b>Txns</button>

  </div>

</div>

<script>
// ===== CARD ENGINE (keep identical in debt.html) =====
var CE = (function () {
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function dim(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function isoD(y, m0, d) { var t = new Date(y, m0, d); return t.getFullYear() + "-" + p2(t.getMonth() + 1) + "-" + p2(t.getDate()); }
  function parseIso(s) { return [parseInt(s.slice(0, 4), 10), parseInt(s.slice(5, 7), 10) - 1, parseInt(s.slice(8, 10), 10)]; }
  function addMonthsIso(iso, n) {
    var a = parseIso(iso), t = a[0] * 12 + a[1] + n, y = Math.floor(t / 12), m = t % 12;
    return isoD(y, m, Math.min(a[2], dim(y, m)));
  }
  function keyOf(iso) { return String(iso).slice(0, 7); }
  function keyParts(key) { return [parseInt(key.slice(0, 4), 10), parseInt(key.slice(5, 7), 10) - 1]; }
  function keyAdd(key, n) { var p = keyParts(key), t = p[0] * 12 + p[1] + n; return Math.floor(t / 12) + "-" + p2((t % 12) + 1); }
  function closeDay(card, y, m0) { return Math.min(card.cutoffDay, dim(y, m0)); }
  function stmtKeyOf(card, iso) {
    var a = parseIso(iso), k = a[0] + "-" + p2(a[1] + 1);
    return a[2] <= closeDay(card, a[0], a[1]) ? k : keyAdd(k, 1);
  }
  function stmtDates(card, key) {
    var p = keyParts(key), y = p[0], m0 = p[1];
    var close = isoD(y, m0, closeDay(card, y, m0));
    var pk = keyParts(keyAdd(key, -1));
    var start = isoD(pk[0], pk[1], closeDay(card, pk[0], pk[1]) + 1);
    var dueKey = card.dueDay > card.cutoffDay ? key : keyAdd(key, 1);
    var dp = keyParts(dueKey);
    var due = isoD(dp[0], dp[1], Math.min(card.dueDay, dim(dp[0], dp[1])));
    return { start: start, close: close, due: due };
  }
  function instPmt(inst) {
    var P = inst.principal, n = inst.months, r = (inst.apr || 0) / 100 / 12;
    if (n < 1) return P;
    if (!r) return Math.round(P / n);
    return Math.round(P * r / (1 - Math.pow(1 + r, -n)));
  }
  function instSchedule(inst) {
    var n = Math.max(1, inst.months), r = (inst.apr || 0) / 100 / 12, pmt = instPmt(inst), bal = inst.principal, rows = [];
    for (var i = 0; i < n; i++) {
      var intr = Math.round(bal * r), prin = pmt - intr;
      if (i === n - 1) prin = bal;
      bal -= prin;
      rows.push({ i: i, date: addMonthsIso(inst.startDate, i), pay: prin + intr, int: intr, prin: prin, balAfter: bal });
    }
    return rows;
  }
  function postings(S, card, today, all) {
    var out = [], i, t, rows, j;
    for (i = 0; i < S.txns.length; i++) {
      t = S.txns[i];
      if (t.cardId === card.id && !t.skipped && (all || t.date <= today)) out.push({ date: t.date, amt: t.amt, catId: t.catId, kind: "txn", open: !!t.opening, sched: t.status === "scheduled" && t.date > today });
    }
    var ins = S.installments || [];
    for (i = 0; i < ins.length; i++) {
      if (ins[i].cardId !== card.id) continue;
      rows = instSchedule(ins[i]);
      for (j = 0; j < rows.length; j++) {
        if (rows[j].date <= today) out.push({ date: rows[j].date, amt: rows[j].pay, catId: ins[i].catId, kind: "inst" });
      }
    }
    return out;
  }
  function statements(S, card, today) {
    var posts = postings(S, card, today, true), pays = [], i, k;
    for (i = 0; i < S.payments.length; i++) if (S.payments[i].cardId === card.id) pays.push(S.payments[i]);
    if (!posts.length && !pays.length) return [];
    var byKey = {}, schBy = {}, payBy = {}, minKey = null, maxKey = stmtKeyOf(card, today);
    for (i = 0; i < posts.length; i++) { k = stmtKeyOf(card, posts[i].date); if (k > maxKey) maxKey = k; }
    for (i = 0; i < posts.length; i++) {
      k = stmtKeyOf(card, posts[i].date);
      byKey[k] = (byKey[k] || 0) + posts[i].amt;
      if (posts[i].sched) schBy[k] = (schBy[k] || 0) + posts[i].amt;
      if (minKey === null || k < minKey) minKey = k;
    }
    for (i = 0; i < pays.length; i++) {
      k = pays[i].stmtKey;
      (payBy[k] = payBy[k] || []).push({ date: pays[i].date, amt: pays[i].amt });
      if (minKey === null || k < minKey) minKey = k;
      if (k > maxKey) maxKey = k;
    }
    var out = [], prev = null, carry = [], key = minKey, guard = 0;
    var st = S.settings || {}, minFixed = st.minFixed == null ? 50000 : st.minFixed, minPct = st.minPct == null ? 5 : st.minPct;
    while (key <= maxKey && guard++ < 1200) {
      var d = stmtDates(card, key), s = { key: key, start: d.start, close: d.close, due: d.due, charges: byKey[key] || 0, sched: schBy[key] || 0, interest: 0, total: 0, paid: 0, remaining: 0, min: 0, status: "Open", est: false, skip: false, pieces: [], remAtDue: 0 };
      if (prev && today > prev.due) s.interest = Math.round(Math.max(0, prev.remAtDue) * (card.apr || 0) / 100 / 12);
      s.total = Math.max(0, s.charges + s.interest);
      var pieces = (payBy[key] || []).concat(carry), sum = 0;
      for (i = 0; i < pieces.length; i++) sum += pieces[i].amt;
      s.pieces = pieces;
      s.paid = Math.min(s.total, sum);
      carry = [];
      var ex = sum - s.paid;
      for (i = pieces.length - 1; i >= 0 && ex > 0; i--) {
        var take = Math.min(ex, pieces[i].amt);
        if (take > 0) { carry.push({ date: pieces[i].date, amt: take }); ex -= take; }
      }
      s.remaining = s.total - s.paid;
      s.est = s.close > today;
      if (s.remaining === 0 && s.total > 0) s.status = "Paid";
      else if (s.start > today) s.status = "Upcoming";
      else if (s.remaining > 0 && today > s.due) s.status = "Overdue";
      else if (s.paid > 0) s.status = "Partial";
      else s.status = "Open";
      s.skip = s.total === 0 && s.paid === 0;
      var cFix = card.minFixed == null ? minFixed : card.minFixed, cPct = card.minPct == null ? minPct : card.minPct, mn = Math.max(cFix, Math.round(s.total * cPct / 100));
      if (card.minCeil) mn = Math.ceil(mn / 100) * 100;
      s.min = Math.min(s.remaining, Math.max(0, Math.min(s.total, mn) - s.paid));
      var atDue = 0;

        const t = S.txns.find(function (x) { return x.id === sh.id; }), r = t && S.recurring.find(function (x) { return x.id === t.recId; });
        if (!t || !r || !confirm("Stop this recurring expense from " + fullDate(t.date) + "? Scheduled occurrences from this date on are removed. Earlier ones stay.")) break;
        const wasSched = t.status === "scheduled" && t.date > todayIso(), a = CE.parseIso(t.date);
        r.endDate = wasSched ? CE.isoD(a[0], a[1], a[2] - 1) : t.date; r.months = null; stamp(r);
        S.txns = S.txns.filter(function (x) { return !(x.recId === r.id && x.status === "scheduled" && x.date > todayIso() && x.date >= t.date); });
        generateRecurring(); persist(); closeSheet(); render(); toast("Recurring stopped from " + shortDate(t.date)); break;
      }
      case "backupnow": backupNow(); break;
      case "rmtest": removeTestData(); break;
      case "snooze": S.settings.backupSnoozeUntil = Date.now() + 7 * 86400000; persist(); render(); break;
      case "restore": pickFile(".json,application/json", restoreFile); break;
      case "exportcsv": exportCsv(filtered()); break;
      case "exportall": exportCsv(S.txns.slice().sort(txSort)); break;
      case "importcsv": pickFile(".csv,text/csv", function (f) { const rd = new FileReader(); rd.onload = function () { openImport(String(rd.result)); }; rd.readAsText(f); }); break;
      case "doimport": doImport(); break;
      case "notifperm":
        try { if (!("Notification" in window)) toast("Notifications are not supported here"); else Notification.requestPermission().then(function (p) { toast(p === "granted" ? "Browser alerts enabled" : "Permission " + p); fireNotifications(); }); } catch (er) { toast("Notifications are not supported here"); }
        break;
    }
  });
  document.addEventListener("input", function (e) {
    const t = e.target;
    if (t.closest && t.closest("#instForm")) updInstPrev();
    else if (t.id === "payAmt") { const c = cardById(sh.cardId), s = CE.statements(S, c, todayIso()).find(function (x) { return x.key === sh.key; }), v = toCents(t.value); $("payWarn").textContent = s && v !== null && v > s.remaining ? "Above the remaining amount. The excess carries to the next statement as credit." : ""; }
    else if (t.getAttribute && t.getAttribute("data-f") && t.tagName === "INPUT") { ui[t.getAttribute("data-f")] = t.value; ui.page = 1; renderTxList(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    if (e.target.id === "txAmt") { e.preventDefault(); saveInline(); }
    else if (e.target.id === "exAmt") { e.preventDefault(); saveTx(); }
  });
  document.addEventListener("change", function (e) {
    const t = e.target, f = t.getAttribute && t.getAttribute("data-f");
    if (t.id === "exRec") { $("exRecBox").style.display = t.checked ? "block" : "none"; return; }
    if (f && t.tagName === "SELECT") { ui[f] = t.value; ui.page = 1; if (f === "repMonth") render(); else renderTxList(); return; }
    if (f && t.tagName === "INPUT") { ui[f] = t.value; ui.page = 1; renderTxList(); return; }
    if (t.getAttribute && t.getAttribute("data-catname")) {
      const c = catById(t.getAttribute("data-catname")), v = t.value.trim();
      if (c && v) { c.name = v; stamp(c); persist(); } else if (c) t.value = c.name;
      return;
    }
    if (t.closest && t.closest("#sheet") && sh && sh.type === "imp") updImpPrev();
  });

  // ---------- lock, startup, updates ----------
  function simpleHash(s) { let h = 5381; for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; } return h; }
  const PASS_HASH = simpleHash("031171");
  function unlock() {
    const input = $("lockInput"), err = $("lockErr");
    if (simpleHash(input.value) === PASS_HASH) { sessionStorage.setItem("ctUnlocked", "1"); revealApp(); }
    else { err.textContent = "Wrong passcode. Try again."; input.value = ""; input.focus(); }
  }
  function revealApp() {
    $("lock").style.display = "none";
    document.body.classList.remove("locked");
    $("app").classList.remove("hidden");
    startApp();
  }
  async function refreshAll() {
    let changed = adoptLocalIfNewer();
    if (generateRecurring()) changed = true;
    if (Date.now() - lastCloud > 20000) { lastCloud = Date.now(); if (await loadCloud()) { changed = true; generateRecurring(); } }
    if (changed && !sheetOpen() && !typing()) render();
  }
  let started = false;
  async function startApp() {
    if (started) return; started = true;
    loadLocal();
    const dl = new URLSearchParams(location.search).get("card");
    if (dl && cardById(dl)) { ui.tab = "cards"; ui.cardId = dl; }
    try { migrateAnytime(); } catch (e) { console.warn("[cards] anytime migration", e); }
    generateRecurring(); render(); fireNotifications();
    lastCloud = Date.now();
    const cloudChanged = await loadCloud();
    const fixed = runRcbcFixes();
    if (cloudChanged || fixed) { generateRecurring(); if (!sheetOpen() && !typing()) render(); }
    fireNotifications();
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refreshAll(); });
    window.addEventListener("focus", refreshAll);
  }

  const APP_VERSION = 196;
  function setFooterVersion() { const fv = $("footVer"); if (fv) fv.textContent = "v" + APP_VERSION; }
  // Manual update only: shows a banner, never auto-reloads.
  async function checkForUpdate() {
    setFooterVersion();
    try {
      const res = await fetch("version.json?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      const j = await res.json();
      if (!(j && typeof j.version === "number" && j.version > APP_VERSION)) return;
      showUpdateBanner(j.version);
    } catch (e) {}
  }
  function showUpdateBanner(ver) {
    if ($("updateBanner")) return;
    const bar = document.createElement("div");
    bar.id = "updateBanner";
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:600;background:#8f8cf5;color:#0f0f1a;font-size:13px;font-weight:700;text-align:center;padding:10px 14px;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.4)";
    bar.textContent = "Update available (v" + ver + ") \u2014 tap to refresh";
    bar.onclick = async function () {
      bar.textContent = "Updating\u2026";
      if (window.caches && caches.keys) { try { const ks = await caches.keys(); await Promise.all(ks.map(function (k) { return caches.delete(k); })); } catch (e) {} }
      const u = new URL(location.href); u.searchParams.set("v", String(ver) + "." + Date.now()); location.replace(u.toString());
    };
    document.body.appendChild(bar);
  }

  $("lockBtn").onclick = unlock;
  $("lockInput").addEventListener("keydown", function (e) { if (e.key === "Enter") unlock(); });
  if (sessionStorage.getItem("ctUnlocked") === "1") revealApp(); else $("lockInput").focus();
  checkForUpdate();
  setInterval(checkForUpdate, 60000);
})();
</script>
<script src="shell.js"></script>
</body>
