<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<link rel="manifest" href="manifest.json" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="FitTrack AI" />
<title>FitTrack AI</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #000000;
    --panel: #16161a;
    --panel-2: #232329;
    --line: #2a2a30;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --gold: #d4a017;
    --gold-bright: #f5c542;
    --danger: #ff6b6b;
    --green: #34d399;
    --red: #ff6b6b;
    --accent: #4f8cff;
    --tabh: 62px;
    --neon: #39e639;
    --neon-ink: #03200a;
    --teal-1: #0b2a2a;
    --teal-2: #04120f;
    --pill: rgba(255,255,255,.08);
    --pill-on: rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--teal-2); }
  html { background: linear-gradient(180deg, var(--teal-1) 0%, var(--teal-2) 55%, #020807 100%) fixed; min-height: 100%; }
  body { background: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    max-width: 820px;
    margin: 0 auto;
    padding: 14px 14px calc(var(--tabh) + 44px + env(safe-area-inset-bottom));
    line-height: 1.4;
    min-height: 100vh;
  }
  @media (min-width: 900px) { body { max-width: 980px; } .tabbar { max-width: 980px !important; } }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 2px; }

  /* Lock screen (shared pattern with the other pages) */
  #lock {
    position: fixed; inset: 0; background: var(--bg); z-index: 9500;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  #lock .lock-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px 24px; width: 100%; max-width: 340px; text-align: center;
  }
  #lock .lk-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  #lock .lk-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  #lock input {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 13px 14px; font-size: 20px; text-align: center; letter-spacing: 6px;
  }
  #lock input:focus { outline: none; border-color: var(--gold); }
  #lock button {
    width: 100%; background: var(--gold); color: #000; border: none; border-radius: 12px;
    padding: 13px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 14px;
  }
  #lock .lk-err { color: var(--danger); font-size: 13px; margin-top: 12px; min-height: 16px; }
  body.locked { overflow: hidden; }
  body.modal-open { overflow: hidden; }
  #app.hidden { display: none; }

  /* Top bar (left padding leaves room for the shared drawer button from shell.js) */
  .topbar { display: flex; align-items: center; gap: 8px; margin: 14px 0 16px; padding-left: 52px; }
  .topbar a.ft-home { color: var(--muted); text-decoration: none; font-size: 13px; padding: 10px 6px; }
  .topbar .title { font-size: 20px; font-weight: 800; letter-spacing: .3px; margin: 0; color: var(--gold-bright); }
  .spacer { flex: 1; }
  .iconbtn {
    position: relative; min-width: 44px; min-height: 44px; border-radius: 12px; background: var(--panel);
    border: 1px solid var(--line); color: var(--text); cursor: pointer; font-size: 13px; padding: 0 12px;
  }
  .iconbtn .badge { position: absolute; top: 2px; right: 2px; background: var(--danger); color: #000; border-radius: 9px; font-size: 10px; font-weight: 800; padding: 1px 5px; }

  /* Cards + grid */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .grid.two { grid-template-columns: 1fr 1fr; } .grid.three { grid-template-columns: 1fr 1fr 1fr; } }
  @media (min-width: 560px) and (max-width: 899px) { .grid.three { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
  .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .card.hl { border-color: rgba(212,160,23,.5); }
  .big { font-size: 24px; font-weight: 800; }
  .sub { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.wrap { flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .mt { margin-top: 10px; } .mt2 { margin-top: 18px; }
  .up { color: var(--green); } .down { color: var(--red); } .warn { color: var(--gold-bright); }
  .hide { display: none !important; }
  h2.sec { font-size: 16px; margin: 18px 0 8px; }

  /* Buttons + forms */
  .btn {
    background: var(--gold); color: #000; border: none; border-radius: 12px; padding: 11px 16px; min-height: 44px;
    font-weight: 700; cursor: pointer; font-size: 14px;
  }
  .btn.block { width: 100%; }
  .btn.sec { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); font-weight: 600; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .btn.sm { min-height: 36px; padding: 6px 12px; font-size: 13px; border-radius: 10px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .lbl { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=number], input[type=time], input[type=date], input[type=password], select, textarea {
    width: 100%; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-height: 44px; color: var(--text);
  }
  textarea { min-height: 70px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 13px; cursor: pointer; user-select: none;
  }
  .chip input { accent-color: var(--gold); width: 16px; height: 16px; margin: 0; }
  .chip:has(input:checked), .chip.on { border-color: var(--gold); background: rgba(212,160,23,.14); }
  .seg { display: flex; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { flex: 1; min-height: 40px; border: none; background: transparent; border-radius: 9px; color: var(--muted); cursor: pointer; font-weight: 600; }
  .seg button.on { background: var(--panel-2); color: var(--gold-bright); }

  /* Progress */
  .bar { height: 10px; background: var(--panel-2); border-radius: 6px; overflow: hidden; margin: 6px 0 4px; }
  .bar > i { display: block; height: 100%; background: var(--gold); border-radius: 6px; }
  .bar.green > i { background: var(--green); } .bar.over > i { background: var(--danger); }
  .dots { display: flex; gap: 8px; }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
  .dot.on { background: var(--green); border-color: var(--green); }
  .badge-s { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px; }
  .badge-s.ok { background: rgba(52,211,153,.16); color: var(--green); }
  .badge-s.inc { background: rgba(255,107,107,.16); color: var(--danger); }
  .badge-s.prog { background: rgba(245,197,66,.16); color: var(--gold-bright); }
  .insight { border-left: 3px solid var(--gold); padding: 4px 0 4px 10px; }

  /* List rows */
  .li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: none; }
  .li .grow { flex: 1; min-width: 0; }
  .li .t { font-weight: 600; font-size: 14px; }
  .xbtn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; min-width: 36px; min-height: 36px; }
  .xbtn.d:hover { color: var(--danger); }
  a.lk { color: var(--gold-bright); cursor: pointer; text-decoration: none; background: none; border: none; padding: 0; font-size: inherit; }

  /* Workout */
  .wk-head { position: sticky; top: 0; z-index: 50; background: var(--bg); padding: 8px 0; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .wk-timer { font-variant-numeric: tabular-nums; color: var(--gold-bright); font-weight: 700; }
  .ex { margin-bottom: 12px; }
  .ex.skipped { opacity: .55; }
  .sugg { background: rgba(212,160,23,.1); border: 1px solid rgba(212,160,23,.4); border-radius: 12px; padding: 10px; margin: 8px 0; font-size: 13px; }
  .sugg.reduce { background: rgba(255,107,107,.08); border-color: rgba(255,107,107,.4); }
  .sets { width: 100%; }
  .sr { display: grid; grid-template-columns: 34px 1fr 1fr 56px 44px; gap: 6px; align-items: center; margin-bottom: 6px; }
  .sr.hd { color: var(--muted); font-size: 11px; text-align: center; margin-bottom: 2px; }
  .sr input[type=number] { text-align: center; padding: 8px 4px; }
  .sr .n { text-align: center; color: var(--muted); font-weight: 700; }
  .sr.done input[type=number] { border-color: var(--green); }
  .sr input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--green); justify-self: center; }
  #restBar {
    position: fixed; left: 50%; transform: translateX(-50%); width: calc(100% - 20px); max-width: 700px;
    bottom: calc(var(--tabh) + 8px + env(safe-area-inset-bottom)); z-index: 300; background: #1d1d24;
    border: 1px solid var(--gold); border-radius: 14px; padding: 10px 14px; display: none; align-items: center; gap: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,.6);
  }
  #restBar.on { display: flex; }
  #restBar .rt { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold-bright); }

  /* Tab bar */
  .tabbar {
    position: fixed; bottom: calc(10px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: calc(100% - 24px); max-width: 560px; z-index: 400;
    height: 62px; padding: 5px; gap: 2px; display: flex; background: rgba(10,30,28,.92); border: 1px solid rgba(255,255,255,.08); border-radius: 999px;
    box-shadow: 0 8px 28px rgba(0,0,0,.55); backdrop-filter: blur(10px);
  }
  .tabbar.hide { display: none; }
  .tabbar button { flex: 1; min-width: 0; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 9px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .tabbar button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar button.on { color: var(--text); background: var(--pill-on); }
  .tabbar button.on svg { stroke: var(--neon); }
  .tabbar button.on svg { stroke: var(--neon); }

  /* My Plan */
  .plan-top { display: flex; align-items: center; gap: 8px; margin: 10px 0 14px; padding-left: 52px; }
  .plan-title { display: flex; align-items: center; gap: 8px; background: none; border: none; cursor: pointer; font-size: 20px; font-weight: 800; padding: 6px 4px; }
  .plan-title svg { width: 24px; height: 24px; fill: none; stroke: var(--text); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .pillgrp { display: flex; align-items: center; background: var(--pill); border-radius: 999px; padding: 2px; }
  .pillgrp button { position: relative; width: 42px; height: 40px; border: none; background: none; color: var(--text); border-radius: 999px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .pillgrp svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .pillgrp .badge { position: absolute; top: 3px; right: 5px; background: var(--danger); color: #000; border-radius: 9px; font-size: 9px; font-weight: 800; padding: 0 4px; }
  .daychips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
  .daychips::-webkit-scrollbar { display: none; }
  .dchip { flex: none; min-height: 38px; padding: 0 16px; border-radius: 999px; border: none; background: var(--pill); color: var(--muted); font-weight: 800; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
  .dchip.done { color: var(--neon); }
  .dchip.sel { background: var(--pill-on); color: var(--text); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  .dchip.done.sel { color: var(--neon); }
  .plan-div { height: 1px; background: rgba(255,255,255,.1); margin: 8px 0 12px; }
  .exhead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .exhead .cnt { font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .rbtn { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--pill); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; }
  .rbtn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tl { position: relative; }
  .tl::before { content: ""; position: absolute; left: 30px; top: 30px; bottom: 30px; width: 2px; background: rgba(57,230,57,.28); border-radius: 2px; }
  .exrow { position: relative; display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; }
  .exrow .thumb { position: relative; flex: none; width: 60px; height: 60px; }
  .exrow .thumb .exi { width: 60px; height: 60px; }
  .li .thumb .exi { width: 52px; height: 52px; border-radius: 14px; }
  .exi { position: relative; overflow: hidden; background: #fff; border-radius: 16px; display: block; }
  .exi .ms { position: absolute; inset: 14%; width: 72%; height: 72%; }
  .exi .ms .b { fill: #cfd8d5; } .exi .ms .h { fill: #1fb81f; }
  .exi img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; }
  /* GIF-style 2-frame loop: a JS interval toggles html.exf every 1s (survives re-renders, not affected by iOS Reduce Motion); frame 1 shows only once loaded */
  .exi img.f1 { opacity: 0; }
  html.exf .exi img.f1.ok { opacity: 1; }
  .mbadge { position: absolute; right: -4px; bottom: -4px; width: 26px; height: 26px; border-radius: 9px; background: #0a1f1c; border: 2px solid #06231f; display: flex; align-items: center; justify-content: center; z-index: 2; }
  .mbadge .ms { width: 18px; height: 18px; } .mbadge .ms .b { fill: #5c6e6a; } .mbadge .ms .h { fill: var(--neon); }
  .exrow .info { flex: 1; min-width: 0; }
  .wtag { display: inline-block; font-size: 9px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #f5c542; background: rgba(245,197,66,.14); border-radius: 999px; padding: 2px 8px; margin-bottom: 3px; }
  .exrow .nm { font-weight: 800; font-size: 16px; line-height: 1.2; }
  .exrow .meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ptag { font-weight: 800; font-size: 11px; margin-left: 6px; white-space: nowrap; }
  .ptag.up { color: var(--neon); } .ptag.down { color: var(--danger); }
  .exrow .dots3 { flex: none; width: 36px; height: 40px; border: none; background: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .tl.compact .exrow .meta { display: none; }
  .startbtn { position: fixed; left: 50%; transform: translateX(-50%); width: calc(100% - 28px); max-width: 560px; bottom: calc(var(--tabh) + 24px + env(safe-area-inset-bottom)); z-index: 350; min-height: 54px; border: none; border-radius: 999px; background: var(--neon); color: var(--neon-ink); font-weight: 900; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; box-shadow: 0 8px 24px rgba(57,230,57,.3); }
  .startgap { height: 70px; }
  /* Force teal gradient + header room (theme.css sets !important on html/body) */
  html, html body { background: linear-gradient(180deg, #0b2a2a 0%, #04120f 55%, #020807 100%) fixed !important; min-height: 100%; }
  @media (max-width: 820px) { html body { padding-top: 12px !important; } }
  .topbar { margin-top: 0; padding-left: 56px; min-height: 44px; }
  /* Exercise sheet */
  #modalHost .md.sheet { padding-top: 8px; position: relative; }
  .sh-handle { width: 44px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.25); margin: 0 auto 12px; }
  /* Sticky top bar on exercise views: back / grab handle (swipe down closes) / close */
  .sh-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; margin: -8px -16px 8px; padding: 8px 12px 6px; background: #0b2a2a; touch-action: none; }
  .sh-top .sh-handle { margin: 0; flex: none; width: 56px; }
  .sh-ic { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 20px; line-height: 1; padding: 0; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .sh-ic.ph { visibility: hidden; }
  #modalHost .ov { cursor: pointer; } #modalHost .md { cursor: auto; }
  .sh-hero { text-align: center; }
  .sh-hero .exi.sh-img { width: 120px; height: 120px; margin: 0 auto; border-radius: 22px; }
  .sh-hero .exi.sh-big { width: 100%; max-width: 300px; height: 240px; margin: 0 auto; border-radius: 18px; }
  .sh-hero .nm { font-size: 20px; font-weight: 800; margin-top: 10px; }
  .sh-chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -4px 4px; padding: 4px; scrollbar-width: none; }
  .shchip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; white-space: nowrap; }
  .shchip.on { border-color: var(--neon); color: var(--neon); }
  .shchip.red { color: var(--danger); border-color: rgba(255,107,107,.45); }
  .sh-panel { background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; margin-top: 8px; text-align: left; }
  .sh-tbl { margin-top: 14px; }
  .sh-row { display: grid; grid-template-columns: 38px 1fr 1fr 30px; gap: 8px; align-items: center; margin-top: 8px; }
  .sh-row.hd { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-top: 0; text-align: center; }
  .sh-row .sn { text-align: center; font-weight: 800; color: var(--muted); }
  .sh-row .sn.w { color: #f5c542; }
  .sh-row input { text-align: center; border-radius: 999px; background: rgba(0,0,0,.35); font-weight: 700; }
  .sh-row .x { border: none; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }
  .sh-add { display: block; width: 100%; margin-top: 12px; min-height: 44px; border: 1px dashed var(--line); border-radius: 999px; background: none; color: var(--neon); font-weight: 800; letter-spacing: .06em; cursor: pointer; }
  .sh-sec { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; }
  .sh-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .sh-stats > div { background: var(--panel-2); border-radius: 14px; padding: 10px 12px; }
  .sh-stats b { display: block; font-size: 16px; }
  .sh-hist { margin-top: 6px; font-size: 13px; } .sh-hist .hr { padding: 8px 0; border-top: 1px solid var(--line); } .sh-hist .hd { color: var(--muted); font-size: 12px; }
  .shstart { position: sticky; bottom: 0; margin-top: 84px; padding-top: 8px; background: linear-gradient(180deg, transparent, var(--panel) 40%); }
  .shstart button { width: 100%; min-height: 54px; border: none; border-radius: 999px; background: var(--neon); color: var(--neon-ink); font-weight: 900; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }

  /* Modal + toast */
  #modalHost .ov { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 8000; display: flex; align-items: flex-end; justify-content: center; }
  @media (min-width: 700px) { #modalHost .ov { align-items: center; } }
  #modalHost .md {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px;
    max-height: 92vh; overflow-y: auto; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) { #modalHost .md { border-radius: 18px; } }
  .md h2 { margin: 0 0 6px; font-size: 18px; }
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabh) + 70px); background: #26262e; border: 1px solid var(--gold);
    color: var(--text); padding: 10px 16px; border-radius: 12px; font-size: 13px; z-index: 9000; max-width: 90vw; display: none;
  }
  #toast.on { display: block; }

  /* Coach */
  .chat { display: flex; flex-direction: column; gap: 10px; margin: 10px 0; }
  .msg { max-width: 92%; padding: 10px 12px; border-radius: 14px; font-size: 14px; white-space: normal; word-wrap: break-word; }
  .msg.u { align-self: flex-end; background: rgba(79,140,255,.18); border: 1px solid rgba(79,140,255,.35); }
  .msg.a { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
  .msg.err { border-color: var(--danger); color: var(--danger); }
  .tag { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 6px; margin-right: 4px; }

  .disc { font-size: 11px; color: var(--muted); }
  canvas.ch { width: 100%; height: 170px; display: block; }
  table.tb { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tb th, table.tb td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  table.tb th { color: var(--muted); font-weight: 600; font-size: 11px; }

  .photos img { width: 100%; border-radius: 10px; aspect-ratio: 3/4; object-fit: cover; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 28px; }

  /* Unified dark teal / neon green style for logging, onboarding, lock, modals, banner, footer */
  :root { --panel: rgba(255,255,255,.06); --panel-2: rgba(0,0,0,.32); --line: rgba(255,255,255,.1); }
  #lock { background: linear-gradient(180deg, var(--teal-1) 0%, var(--teal-2) 60%, #020807 100%); }
  #lock .lock-card { background: rgba(255,255,255,.06); border-radius: 24px; }
  #lock .lk-title { text-transform: uppercase; letter-spacing: .08em; font-weight: 900; }
  #lock input { border-radius: 999px; background: rgba(0,0,0,.35); }
  #lock input:focus { border-color: var(--neon); }
  #lock button { background: var(--neon); color: var(--neon-ink); border-radius: 999px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; }
  :focus-visible { outline-color: var(--neon); }
  .topbar .title { color: var(--text); text-transform: uppercase; letter-spacing: .08em; font-size: 18px; font-weight: 900; }
  .iconbtn { background: var(--pill); border: none; border-radius: 999px; }
  .card { border-radius: 20px; }
  .card h3, .lbl { text-transform: uppercase; letter-spacing: .08em; font-weight: 800; font-size: 11px; }
  .card.hl { border-color: rgba(57,230,57,.45); }
  .btn { background: var(--neon); color: var(--neon-ink); border-radius: 999px; font-weight: 900; letter-spacing: .05em; text-transform: uppercase; }
  .btn.sec { background: var(--pill); color: var(--text); border: none; }
  .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  input[type=text], input[type=number], input[type=time], input[type=date], input[type=password], select, textarea { border-radius: 14px; }
  input:focus, select:focus, textarea:focus { border-color: var(--neon); }
  .chip { border-radius: 999px; }
  .chip input { accent-color: var(--neon); }
  .chip:has(input:checked), .chip.on { border-color: var(--neon); background: rgba(57,230,57,.12); color: var(--neon); }

  .seg button.on { background: var(--pill-on); color: var(--neon); }
  .bar > i { background: var(--neon); }

  a.lk { color: var(--neon); }
  .wk-head { background: linear-gradient(180deg, var(--teal-1), rgba(11,42,42,.92)); border-bottom: 1px solid var(--line); border-radius: 0 0 18px 18px; padding: 10px 12px; }
  .wk-timer { color: var(--neon); }

  #modalHost .md { background: linear-gradient(180deg, #0b2a2a 0%, #04120f 100%); border: 1px solid rgba(255,255,255,.08); border-radius: 28px 28px 0 0; }
  @media (min-width: 700px) { #modalHost .md { border-radius: 28px; } }
  .md h2 { font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 16px; }
  #toast { background: rgba(10,30,28,.96); border: 1px solid var(--neon); border-radius: 999px; }

  .foot { text-transform: uppercase; letter-spacing: .06em; font-size: 10px; font-weight: 700; padding: 0 12px; }

<script>
  // ---------- Passcode lock (same scheme as the other pages) ----------
  function simpleHash(s) {
    let h = 5381;
    for (let i = 0; i < s.length; i++) { h = ((h << 5) + h) + s.charCodeAt(i); h |= 0; }
    return h;
  }
  const PASS_HASH = simpleHash("031171");

  function unlock() {
    const input = document.getElementById("lockInput");
    const err = document.getElementById("lockErr");
    if (simpleHash(input.value) === PASS_HASH) {
      sessionStorage.setItem("ctUnlocked", "1");
      revealApp();
    } else {
      err.textContent = "Wrong passcode. Try again.";
      input.value = ""; input.focus();
    }
  }
  function revealApp() {
    document.getElementById("lock").style.display = "none";
    document.body.classList.remove("locked");
    document.getElementById("app").classList.remove("hidden");
    boot();
  }

  // Gemini key for the AI coach is NOT stored in code (public repo; GitHub push
  // protection blocks it). Enter it once per device in Settings — kept in
  // localStorage "ft_gemini_key" only, never synced or committed.
  const DEFAULT_GEMINI_KEY = "";
  function geminiKey() { try { return (localStorage.getItem("ft_gemini_key") || "").trim() || DEFAULT_GEMINI_KEY; } catch (e) { return DEFAULT_GEMINI_KEY; } }

  // ---------- Auto-update (manual banner only; never auto-reload) ----------
  const APP_VERSION = 176;
  function setFooterVersion() { const fv = document.getElementById("footVer"); if (fv) fv.textContent = "v" + APP_VERSION; }
  async function checkForUpdate() {
    setFooterVersion();
    try {
      const res = await fetch("version.json?ts=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return;
      const j = await res.json();
      if (!(j && typeof j.version === "number" && j.version > APP_VERSION)) return;
      showUpdateBanner(j.version);
    } catch (e) {}
  }
  function showUpdateBanner(ver) {
    if (document.getElementById("updateBanner")) return;
    const bar = document.createElement("div");
    bar.id = "updateBanner";
    bar.style.cssText = "position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom));z-index:600;background:#39e639;color:#03200a;" +
      "left:12px;right:12px;border-radius:999px;font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;text-align:center;padding:12px 14px;cursor:pointer;box-shadow:0 8px 24px rgba(57,230,57,.3)";
    bar.textContent = "Update available (v" + ver + ") \u2014 tap to refresh";
    bar.onclick = async () => {
      bar.textContent = "Updating\u2026";
      if (window.caches && caches.keys) {
        try { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); } catch (e) {}
      }
      const u = new URL(location.href);
      u.searchParams.set("v", String(ver) + "." + Date.now());
      location.replace(u.toString());
    };
    document.body.appendChild(bar);
  }

  // ---------- Small helpers ----------
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { if (v === "" || v == null) return null; const n = parseFloat(v); return isFinite(n) ? n : null; };
  const r1 = (n) => Math.round(n * 10) / 10;
  const r0 = (n) => Math.round(n);
  const pad2 = (n) => (n < 10 ? "0" : "") + n;
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function ymd(d) { d = d || new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function parseYmd(s) { const p = String(s).split("-").map(Number); return new Date(p[0], (p[1] || 1) - 1, p[2] || 1); }
  function todayStr() { return ymd(new Date()); }
  function addDays(s, n) { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
  function weekStart(s) { const d = parseYmd(s || todayStr()); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); }
  const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function fmtDate(s) { const d = parseYmd(s); return DOW[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate(); }
  function fmtShort(s) { const d = parseYmd(s); return MON[d.getMonth()] + " " + d.getDate(); }
  function fmtDur(sec) { sec = Math.max(0, Math.round(sec || 0)); const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60; return h ? h + ":" + pad2(m) + ":" + pad2(s) : m + ":" + pad2(s); }
  function roundHalf(n) { return Math.round(n * 2) / 2; }
  const kgS = (n) => (n == null ? "\u2013" : r1(n) + " kg");

  // ---------- State ----------
  const LS_KEY = "fittrackV1";
  const LS_PHOTOS = "ft_photos";
  const LS_DRAFT = "ft_draft_session";
  let state = null;
  function defaultState() {
    return {
      version: 1,
      profile: {
        onboarded: false, name: "", heightCm: null, weightKg: null, age: null, sex: "male", experience: "beginner",
        goal: "general", targetWeightKg: null, targetSmmKg: null, targetBodyFatPct: null,
        daysPerWeek: 3, preferredDays: [1, 3, 5], sessionMinutes: 60,
        equipment: ["barbell", "dumbbell", "machine", "cable", "bodyweight"],
        limitations: "", painAreas: [], units: { weight: "kg", energy: "kcal" },
        nutritionTargets: { kcal: 2000, protein: 120, carbs: 230, fat: 60, auto: true }
      },
      programs: [], customExercises: [], sessions: [], foods: [], foodLog: [], recentFoods: [], body: [],
      notifications: {
        enabled: true, workoutReminder: { on: true, time: "17:00" }, nutritionReminder: { on: true, time: "20:00" },
        missedWorkout: true, weeklySummary: { on: true, day: 0 }, restAlerts: true, milestones: true, lastFired: {}
      },
      inbox: [], coach: { messages: [], reports: [] }, privacy: { aiSendsHistory: true }, ui: { tab: "today" }
    };
  }
  function sanitizeState() {
    const d = defaultState();
    if (!state || typeof state !== "object") state = d;
    state.version = 1;
    state.profile = Object.assign({}, d.profile, state.profile || {});
    state.profile.nutritionTargets = Object.assign({}, d.profile.nutritionTargets, state.profile.nutritionTargets || {});
    state.profile.units = d.profile.units;
    ["equipment", "preferredDays", "painAreas"].forEach((k) => { if (!Array.isArray(state.profile[k])) state.profile[k] = d.profile[k]; });
    ["programs", "customExercises", "sessions", "foods", "foodLog", "recentFoods", "body", "inbox"].forEach((k) => { if (!Array.isArray(state[k])) state[k] = []; });
    const n = state.notifications = Object.assign({}, d.notifications, state.notifications || {});
    n.workoutReminder = Object.assign({}, d.notifications.workoutReminder, n.workoutReminder || {});
    n.nutritionReminder = Object.assign({}, d.notifications.nutritionReminder, n.nutritionReminder || {});
    n.weeklySummary = Object.assign({}, d.notifications.weeklySummary, n.weeklySummary || {});
    if (!n.lastFired || typeof n.lastFired !== "object") n.lastFired = {};
    state.coach = Object.assign({}, d.coach, state.coach || {});
    if (!Array.isArray(state.coach.messages)) state.coach.messages = [];
    if (!Array.isArray(state.coach.reports)) state.coach.reports = [];
    state.privacy = Object.assign({}, d.privacy, state.privacy || {});
    state.ui = Object.assign({}, d.ui, state.ui || {});
    state.programs.forEach((p) => { if (!Array.isArray(p.days)) p.days = []; p.days.forEach((dy) => { if (!Array.isArray(dy.exercises)) dy.exercises = []; }); });
    state.sessions.forEach((s) => { if (!Array.isArray(s.exercises)) s.exercises = []; s.exercises.forEach((e) => { if (!Array.isArray(e.sets)) e.sets = []; }); });
  }
  function loadState() {
    try { const raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : null; } catch (e) { state = null; }
    sanitizeState();
  }
  function save() {
    state.updatedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { console.warn("[fittrack] local save failed", e); }
    try {
      const a = activeSession();
      if (a) localStorage.setItem(LS_DRAFT, JSON.stringify(a)); else localStorage.removeItem(LS_DRAFT);
    } catch (e) {}
    cloudSaveState();
  }
  function getPhotos() { try { return JSON.parse(localStorage.getItem(LS_PHOTOS) || "{}") || {}; } catch (e) { return {}; } }
  function setPhotos(o) { try { localStorage.setItem(LS_PHOTOS, JSON.stringify(o)); return true; } catch (e) { toast("Photo storage is full on this device"); return false; } }

  // ---------- Firebase (reuse the tracker project; separate 'fittrack' path) ----------
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyATaU8PnQwkMRvf6_j6Ccp1j0Qz8oeyELI",
    authDomain: "crypto-tracker-bfefb.firebaseapp.com",
    databaseURL: "https://crypto-tracker-bfefb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "crypto-tracker-bfefb",
    storageBucket: "crypto-tracker-bfefb.firebasestorage.app",
    messagingSenderId: "901782471631",
    appId: "1:901782471631:web:5c7ec398e607b1777548ba"
  };
  let fbDb = null, fbStateRef = null, applyingRemote = false, saveTimer = null;
  const CLIENT_ID = Math.random().toString(36).slice(2) + Date.now();
  let firstSnapshot = true;

  function fbInit() {
    try {
      if (typeof firebase === "undefined") return;
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      fbDb = firebase.database();
      fbStateRef = fbDb.ref("fittrack/state");
      fbStateRef.on("value", (snap) => {
        const remote = snap.val();
        if (remote && typeof remote.stateJson === "string") {
          try { remote.state = JSON.parse(remote.stateJson); } catch (e) { remote.state = null; }
        }
        if (remote && remote.state && remote.state.profile) {
          if (remote.client === CLIENT_ID && !firstSnapshot) return;
          // Never let an older cloud copy overwrite newer local data (e.g. a workout logged moments ago).
          const rUp = Number(remote.state.updatedAt || remote.updatedAt || 0), lUp = Number(state.updatedAt || 0);
          if (lUp > rUp) { firstSnapshot = false; if (state.profile && state.profile.onboarded) cloudSaveState(true); return; }
          firstSnapshot = false;
          applyingRemote = true;
          try {
            state = remote.state;
            sanitizeState();
            localStorage.setItem(LS_KEY, JSON.stringify(state));
            renderAll();
          } catch (e) {
            console.error("[fittrack] render after sync failed:", e);
          } finally {
            applyingRemote = false;
          }
        } else {
          firstSnapshot = false;
          if (state.profile && state.profile.onboarded) cloudSaveState(true);
        }
      }, (err) => { console.warn("[fittrack] firebase listen error:", err); });
    } catch (e) { fbDb = null; }
  }
  function cloudSaveState(immediate) {
    if (applyingRemote) return;
    clearTimeout(saveTimer);
    const doSave = () => {
      saveTimer = null;
      let stateJson;
      try { stateJson = JSON.stringify(state); } catch (e) { stateJson = JSON.stringify(defaultState()); }
      const payload = JSON.stringify({ stateJson: stateJson, updatedAt: Date.now(), client: CLIENT_ID });
      const url = FIREBASE_CONFIG.databaseURL.replace(/\/$/, "") + "/fittrack/state.json";
      const ctrl = ("AbortController" in window) ? new AbortController() : null;
      const timer = ctrl ? setTimeout(() => ctrl.abort(), 15000) : null;
      fetch(url, { method: "PUT", body: payload, signal: ctrl ? ctrl.signal : undefined })
        .then(() => { if (timer) clearTimeout(timer); })
        .catch((err) => { if (timer) clearTimeout(timer); console.warn("[fittrack] cloud save failed (offline?):", err); });
    };
    if (immediate) doSave(); else saveTimer = setTimeout(doSave, 800);
  }
  function flushCloudSave() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; cloudSaveState(true); } }
  window.addEventListener("pagehide", flushCloudSave);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushCloudSave(); });

  // ---------- Data: exercise library ----------
  // [id, name, primary, secondary, equipment, category (C compound / I isolation), repMin, repMax, difficulty, alternatives, instructions]
  const EX_RAW = [
    ["bb_bench", "Barbell Bench Press", "chest", "triceps,shoulders", "barbell", "C", 5, 8, "intermediate", "db_bench,machine_chest,pushup", "Lie on a flat bench, lower the bar to mid-chest with elbows ~45\u00b0, press up without bouncing."],
    ["db_bench", "Dumbbell Bench Press", "chest", "triceps,shoulders", "dumbbell", "C", 6, 12, "beginner", "bb_bench,machine_chest,pushup", "Press two dumbbells from chest level to lockout, control the descent."],
    ["incline_db", "Incline Dumbbell Press", "chest", "shoulders,triceps", "dumbbell", "C", 6, 12, "beginner", "incline_bb,db_bench", "Bench at 30\u201345\u00b0. Press dumbbells up and slightly together, lower to upper chest."],
    ["incline_bb", "Incline Barbell Press", "chest", "shoulders,triceps", "barbell", "C", 5, 10, "intermediate", "incline_db,machine_chest", "Bench at 30\u201345\u00b0. Lower bar to upper chest, press to lockout."],
    ["machine_chest", "Machine Chest Press", "chest", "triceps,shoulders", "machine", "C", 8, 12, "beginner", "db_bench,pushup", "Adjust seat so handles are at mid-chest. Press smoothly and control the return."],
    ["cable_fly", "Cable Fly", "chest", "shoulders", "cable", "I", 10, 15, "beginner", "pec_deck,db_bench", "Slight elbow bend, bring handles together in a hugging arc, stretch under control."],
    ["pec_deck", "Pec Deck", "chest", "shoulders", "machine", "I", 10, 15, "beginner", "cable_fly", "Elbows at shoulder height, squeeze pads together, return slowly."],

      }
      case "set-delete-all": {
        if ($("#delConfirm").value.trim() !== "DELETE") { toast("Type DELETE to confirm."); break; }
        state = defaultState(); sanitizeState(); try { localStorage.removeItem(LS_PHOTOS); localStorage.removeItem(LS_DRAFT); } catch (e) {}
        nav.ob = null; nav.editor = null; nav.workoutOpen = false; rest = null; save(); cloudSaveState(true); closeModal(); renderAll(); toast("All data deleted."); break;
      }
    }
  }
  document.addEventListener("click", (ev) => { const el = ev.target.closest("[data-act]"); if (el) act(el.dataset.act, el, ev); });
  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.sh) return shField(t);
    if (t.dataset && t.dataset.wf && (t.type === "number" || t.type === "text")) return onWorkoutField(t);
    if (t.dataset && t.dataset.ef && nav.editor) {
      const f = t.dataset.ef;
      if (f === "pname") nav.editor.name = t.value;
      else if (f === "dname") nav.editor.days[+t.dataset.di].name = t.value;
      else { const x = nav.editor.days[+t.dataset.di].exercises[+t.dataset.xi]; x[f] = Math.max(1, parseInt(t.value, 10) || 1); }
      return;
    }
    if (t.id === "libq") { nav.libQ = t.value; $("#libList").innerHTML = libListHtml(); }
    else if (t.id === "fq") { nav.foodQ = t.value; updateFoodResults(); }
    else if (t.id === "pickQty") updatePickPrev();
    else if (t.id === "edq") { const q = t.value.toLowerCase().trim(); pickList($("#edList"), allExercises().filter((e) => !q || e.name.toLowerCase().indexOf(q) >= 0 || e.primary.indexOf(q) >= 0).slice(0, 30), "ed-pick"); }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset && t.dataset.sh) { shField(t); if (/kg$/.test(t.dataset.sh)) t.value = (num(t.value) || 0).toFixed(2); renderAll(true); if (t.dataset.sh === "rest") renderSheet(); return; }
    if (t.dataset && t.dataset.wf && (t.type === "checkbox" || t.tagName === "SELECT")) return onWorkoutField(t);
    if (t.id === "libm") { nav.libM = t.value; $("#libList").innerHTML = libListHtml(); }
    else if (t.id === "libe") { nav.libE = t.value; $("#libList").innerHTML = libListHtml(); }
    else if (t.id === "photoIn" && t.files && t.files[0]) resizePhoto(t.files[0], (data) => { nav.pendingPhoto = data; const pv = $("#photoPrev"); if (pv) pv.innerHTML = '<img src="' + data + '" alt="Photo preview" style="max-width:120px;border-radius:10px" />'; });
  });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $("#modalHost .ov")) closeModal(); });
  // Swipe down on an exercise view's top bar (grab handle) closes it
  let shDrag = null;
  document.addEventListener("touchstart", (ev) => {
    const t = ev.target; if (!t.closest || !t.closest("#modalHost .sh-top") || t.closest("button")) return;
    const md = modalRoot(); if (md) { shDrag = { y: ev.touches[0].clientY, dy: 0, md: md }; md.style.transition = "none"; }
  }, { passive: true });
  document.addEventListener("touchmove", (ev) => { if (!shDrag) return; shDrag.dy = Math.max(0, ev.touches[0].clientY - shDrag.y); shDrag.md.style.transform = "translateY(" + shDrag.dy + "px)"; }, { passive: true });
  const shDragEnd = () => { if (!shDrag) return; const d = shDrag; shDrag = null; if (d.dy > 70) closeModal(); else { d.md.style.transition = "transform .2s"; d.md.style.transform = ""; } };
  document.addEventListener("touchend", shDragEnd, { passive: true });
  document.addEventListener("touchcancel", shDragEnd, { passive: true });

  // ---------- Wire up ----------
  function boot() {
    loadState();
    if (activeSession()) { nav.workoutOpen = true; state.ui.tab = "plan"; }
    renderAll(); fbInit(); checkForUpdate(); setInterval(checkForUpdate, 60000);
    setInterval(tick, 1000); startReminderLoop(); startExFrames();
  }
  document.getElementById("lockBtn").onclick = unlock;
  document.getElementById("lockInput").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
  if (sessionStorage.getItem("ctUnlocked") === "1") revealApp();
  else document.getElementById("lockInput").focus();
</script>
<script src="shell.js"></script>

</body>
