<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Shared Debt</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root {
    --bg: #000000; --panel: #16161a; --panel-2: #232329; --line: #2a2a30;
    --text: #f2f2f7; --muted: #8e8e93; --gold: #d4a017; --gold-bright: #f5c542;
    --danger: #ff6b6b; --green: #34d399; --red: #ff6b6b; --accent: #4f8cff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text); max-width: 820px; margin: 0 auto; padding: 14px 14px 60px; line-height: 1.4;
  }
  .hero { text-align: center; margin: 20px 0 18px; }
  .hero .cap { color: var(--muted); font-size: 13px; }
  .hero .who { font-size: 26px; font-weight: 800; margin-top: 4px;
    background: linear-gradient(90deg, var(--gold-bright), var(--gold));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero .made { color: var(--muted); font-size: 12px; margin-top: 6px; }

  .month-bar { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 16px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .month-bar button { background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; width: 38px; height: 38px; font-size: 18px; cursor: pointer; }
  .month-bar .m-label { font-size: 16px; font-weight: 700; min-width: 150px; text-align: center; }

  .summary { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .summary .srow { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 14px; }
  .summary .srow .lbl { color: var(--muted); }
  .summary .srow .val { font-weight: 700; }
  .summary .srow .val.owed { color: var(--red); }
  .summary .srow .val.paid { color: var(--green); }
  .summary .big { font-size: 24px; font-weight: 800; }

  .debt-item { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 14px; }
  .debt-item.paid-off { border-color: rgba(52,211,153,0.4); }
  .d-amounts { display: flex; justify-content: space-between; font-size: 13px; margin: 8px 0; }
  .d-amounts .seg { text-align: center; flex: 1; }
  .d-amounts .seg .k { color: var(--muted); font-size: 11px; }
  .d-amounts .seg .v { font-weight: 700; font-size: 14px; margin-top: 1px; }
  .d-amounts .seg .v.owed { color: var(--red); } .d-amounts .seg .v.paid { color: var(--green); }
  .d-bar { height: 8px; background: var(--panel-2); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
  .d-bar .fill { height: 100%; background: linear-gradient(90deg, var(--green), #4fd1a5); border-radius: 999px; }

  .sub-box { margin-top: 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  .sub-box-head { display: flex; justify-content: space-between; font-size: 11px; color: var(--gold-bright);
    text-transform: uppercase; letter-spacing: .4px; font-weight: 700; margin-bottom: 4px; }
  .bd-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); }
  .bd-row:first-of-type { border-top: none; }
  .bd-row.bd-paid .bd-label, .bd-row.bd-paid .bd-amt { color: var(--muted); text-decoration: line-through; }
  .bd-dot { width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1px solid var(--line); display: inline-block; }
  .bd-dot.on { background: var(--green); border-color: var(--green); }
  .bd-label { flex: 1; } .bd-amt { font-weight: 600; }
  .bd-date { color: var(--muted); font-size: 11px; text-decoration: none; }
  .bd-term { display: inline-block; background: rgba(79,140,255,0.18); color: #7fa8ff; font-size: 10px;
    font-weight: 700; padding: 1px 6px; border-radius: 999px; text-decoration: none; }
  .due-tag { display: inline-block; background: rgba(245,197,66,0.15); color: var(--gold-bright); font-size: 10px;
    font-weight: 700; padding: 1px 6px; border-radius: 999px; text-decoration: none; }

  .bd-dot.on { color: #000; font-size: 11px; font-weight: 800; line-height: 14px; text-align: center; }
  .bd-row.has-sub, .bd-row.paid-head { cursor: pointer; }
  .bd-row.paid-head .bd-label, .bd-row.paid-head .bd-amt { color: #c7c7cc; }
  .chev { width: 14px; flex: none; color: #f2f2f7; font-size: 14px; text-align: center; }
  .bd-subrow { padding-left: 24px; font-size: 12.5px; color: #a1a1a6; }
  .bd-row.bd-paid .bd-label, .bd-row.bd-paid .bd-amt { color: #a1a1a6; }
  .cut-card { background: #232329; border: 1px solid #2a2a30; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .cut-card .cc-title { font-size: 12px; font-weight: 700; letter-spacing: .4px; color: #f2f2f7; margin-bottom: 6px; }
  .cut-card .cc-total { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: #c7c7cc; padding: 2px 0; }
  .cut-card .cc-total b { font-size: 20px; color: #f2f2f7; }
  .cut-card .cc-total.over { color: #ff9a9a; } .cut-card .cc-total.over b { font-size: 14px; color: #ff9a9a; }
  .cut-card .cc-list { margin-top: 6px; border-top: 1px solid #2a2a30; }
  .cut-card .cc-row { display: flex; gap: 8px; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid #2a2a30; color: #f2f2f7; }
  .cut-card .cc-row .dt { width: 52px; flex: none; color: #c7c7cc; }
  .cut-card .cc-row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cut-card .cc-row .am { font-weight: 600; }
  .cut-card .cc-row.over, .cut-card .cc-row.over .dt { color: #ff9a9a; background: rgba(255,107,107,0.08); }
  .cut-card .cc-empty { font-size: 12.5px; color: #c7c7cc; padding: 6px 0; }
  .cut-card .cc-month { display: flex; justify-content: space-between; font-size: 12px; color: #c7c7cc; margin-top: 6px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
  .card h2 { font-size: 13px; color: var(--gold-bright); margin: 0 0 10px; text-transform: uppercase; letter-spacing: .5px; }
  .note-box { width: 100%; min-height: 90px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 14px; resize: vertical; }
  .note-box:focus { outline: none; border-color: var(--gold); }
  .send-btn { margin-top: 10px; width: 100%; background: var(--gold); color: #000; border: none;
    border-radius: 12px; padding: 12px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .send-btn:hover { filter: brightness(1.05); }
  .note-hint { color: var(--muted); font-size: 11px; line-height: 1.6; margin-top: 6px; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 24px; }
  .err { color: var(--danger); text-align: center; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>
  <div id="app"></div>

<script>
  function num(v) { if (v == null) return 0; const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; }
  function peso(n) { return "PHP " + (n < 0 ? "-" : "") + Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  const SUBCATS = { food:"Food", groceries:"Groceries", entertainment:"Entertainment", shopping:"Shopping",
    bills:"Bills / Utilities", transport:"Transportation", health:"Health / Medical", travel:"Travel", emergency:"Emergency", other:"Other" };
  function subLabel(s){ return SUBCATS[s] || "Other"; }
  function cutoffForDueDay(day){ return (day>=1 && day<=15) ? "1st cutoff" : "2nd cutoff"; }

  // Timezone-safe month math (pure strings, no Date parsing drift).
  const MONTH_NAMES=["January","February","March","April","May","June","July","August","September","October","November","December"];
  function monthKey(d){ return (d instanceof Date) ? (d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")) : String(d).slice(0,7); }
  function parseKey(k){ return [parseInt((k||"").slice(0,4),10), parseInt((k||"").slice(5,7),10)-1]; }
  function monthLabel(k){ const[y,m]=parseKey(k); return (isNaN(y)||m<0||m>11)?k:(MONTH_NAMES[m]+" "+y); }
  function addMonths(k,n){ let[y,m]=parseKey(k); const t=y*12+m+n; return Math.floor(t/12)+"-"+String((t%12)+1).padStart(2,"0"); }
  function termIndexFor(it,k){ const[sy,sm]=parseKey(it.startMonth),[cy,cm]=parseKey(k); return (cy-sy)*12+(cm-sm); }
  // Plan (payday split) awareness — mirrors the main tracker so shared totals match.
  function hasPlan(it){ return Array.isArray(it.plan) && it.plan.length>0; }
  function planEntriesFor(it,k){ return hasPlan(it) ? it.plan.filter(p=>p.key===k).sort((a,b)=>a.payday-b.payday) : []; }
  function isActiveIn(it,k){
    if (hasPlan(it)) return planEntriesFor(it,k).length>0;
    const i=termIndexFor(it,k); if(i<0)return false;
    if(it.recurring)return !it.endMonth||k<=it.endMonth; return i<(it.terms||1);
  }
  function perTermOf(it){
    if (hasPlan(it)) return planEntriesFor(it, viewMonth).reduce((s,p)=>s+num(p.amount),0);
    return (it.terms>1 && !it.recurring) ? num(it.amount)/it.terms : num(it.amount);
  }
  function isPaidThisMonth(it,k){
    if (hasPlan(it)) { const es=planEntriesFor(it,k); return es.length>0 && es.every(p=>p.paid); }
    if(it.recurring||it.terms>1)return !!(it.paidTerms||{})[k]; return !!it.paid;
  }
  function paidOf(it){
    if (hasPlan(it)) return it.plan.reduce((s,p)=>s+(p.paid?num(p.amount):0),0);
    if (it.recurring || it.terms>1) return Object.keys(it.paidTerms||{}).filter(x=>it.paidTerms[x]).length * perTermOf(it);
    return it.paid ? num(it.amount) : 0;
  }
  function remainingOf(it){
    if (hasPlan(it)) return it.plan.reduce((s,p)=>s+(p.paid?0:num(p.amount)),0);
    if(it.recurring) return isPaidThisMonth(it, viewMonth)?0:num(it.amount);
    return Math.max(0, num(it.amount)-paidOf(it));
  }

  // ---- Cutoff helpers (same logic as debt.html periodOf/loadCutDays; viewer has no settings => 13 / 28) ----
  function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function p2(n) { return (n < 10 ? "0" : "") + n; }
  function isoD(y, m0, d) { const t = new Date(y, m0, d); return t.getFullYear() + "-" + p2(t.getMonth() + 1) + "-" + p2(t.getDate()); }
  function dimOf(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
  function parseIso(s) { return [parseInt(s.slice(0, 4), 10), parseInt(s.slice(5, 7), 10) - 1, parseInt(s.slice(8, 10), 10)]; }
  function addDaysIso(s, n) { const [y, m, d] = parseIso(s); return isoD(y, m, d + n); }
  function loadCutDays() { return { a: 13, b: 28 }; }
  function cutEndDay(cd, y, m0) { const D = dimOf(y, m0); return cd.b ? Math.min(cd.b, D) : D; }
  function periodOf(s) {
    const cd = loadCutDays(), [y, m0, x] = parseIso(s);
    const c2 = cutEndDay(cd, y, m0);
    if (x <= cd.a) {
      const pm = new Date(y, m0 - 1, 1), py = pm.getFullYear(), pmo = pm.getMonth();
      const pc2 = cutEndDay(cd, py, pmo);
      return { start: pc2 >= dimOf(py, pmo) ? isoD(y, m0, 1) : isoD(py, pmo, pc2 + 1), end: isoD(y, m0, cd.a) };
    }
    if (x <= c2) return { start: isoD(y, m0, cd.a + 1), end: isoD(y, m0, c2) };
    return { start: isoD(y, m0, c2 + 1), end: isoD(y, m0 + 1, cd.a) };
  }
  function shortDate(s) { const [y, m, d] = parseIso(s); return MONTH_NAMES[m].slice(0, 3) + " " + d; }
  // Due date (ISO) of an item inside month key k: plan payday, else dueDay, else "" (earliest unpaid plan entry wins).
  function itemDueIso(it, k) {
    const [y, m0] = parseKey(k), D = dimOf(y, m0);
    if (hasPlan(it)) {
      const es = planEntriesFor(it, k); if (!es.length) return "";
      const pick = es.filter(p => !p.paid)[0] || es[0];
      return isoD(y, m0, Math.min(Math.max(1, Math.round(num(pick.payday)) || 1), D));
    }
    return (it.dueDay >= 1 && it.dueDay <= 31) ? isoD(y, m0, Math.min(it.dueDay, D)) : "";
  }
  // All dated payments inside [start, end]. Items without a due date are skipped.
  function occurrencesIn(start, end) {
    const out = [];
    let key = monthKey(start);
    const lastKey = monthKey(end);
    for (let guard = 0; key <= lastKey && guard < 80; guard++, key = addMonths(key, 1)) {
      const [y, m0] = parseKey(key), D = dimOf(y, m0);
      data.items.forEach(it => {
        const name = (it.name && it.name.trim()) ? it.name.trim() : (data.kind === "receivable" ? "Item" : "Debt");
        if (hasPlan(it)) {
          it.plan.forEach(p => {
            if (p.key !== key) return;
            const date = isoD(y, m0, Math.min(Math.max(1, Math.round(num(p.payday)) || 1), D));
            if (date < start || date > end) return;
            const full = num(p.amount);
            if (full <= 0) return;
            out.push({ date: date, name: name, amount: full, paid: !!p.paid, recurring: false });
          });
          return;
        }
        if (!(it.dueDay >= 1 && it.dueDay <= 31) || !isActiveIn(it, key)) return;
        const date = isoD(y, m0, Math.min(it.dueDay, D));
        if (date < start || date > end) return;
        const multi = it.recurring || it.terms > 1;
        const full = (it.terms > 1 && !it.recurring) ? num(it.amount) / it.terms : num(it.amount);
        if (full <= 0) return;
        const checked = multi ? !!(it.paidTerms && it.paidTerms[key]) : !!it.paid;
        const part = multi ? (num((it.paidAmt || {})[key]) || 0) : (num(it.paidOnce) || 0);
        const paid = checked || part >= full - 0.009;
        out.push({ date: date, name: name, amount: paid ? full : Math.max(0, full - part), paid: paid, recurring: !!it.recurring });
      });
    }
    out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.name < b.name ? -1 : 1));
    return out;
  }
  function sumUnpaid(list) { return list.reduce((s, o) => s + (o.paid ? 0 : o.amount), 0); }
  function cutoffCardHtml(isRecv) {
    const now = new Date(), today = isoD(now.getFullYear(), now.getMonth(), now.getDate());
    const P = periodOf(today);
    const list = occurrencesIn(P.start, P.end).filter(o => !o.paid);
    const [ty, tm] = parseIso(today);
    const lookback = isoD(ty, tm - 24, 1), recurFrom = isoD(ty, tm - 2, 1);
    const over = occurrencesIn(lookback, addDaysIso(P.start, -1)).filter(o => !o.paid && (!o.recurring || o.date >= recurFrom));
    const monthL = occurrencesIn(isoD(ty, tm, 1), isoD(ty, tm + 1, 0)).filter(o => !o.paid);
    const total = sumUnpaid(list), overTotal = sumUnpaid(over), monthTotal = sumUnpaid(monthL);
    const row = (o, red) => '<div class="cc-row' + (red ? ' over' : '') + '"><span class="dt">' + shortDate(o.date) + '</span><span class="nm">' + esc(o.name) +
      '</span><span class="am">' + peso(o.amount) + '</span></div>';
    const rows = over.map(o => row(o, true)).join("") + list.map(o => row(o, o.date < today)).join("");
    return '<div class="cut-card"><div class="cc-title">' + (isRecv ? "TO RECEIVE THIS CUTOFF" : "TO PAY THIS CUTOFF") + ' \u00b7 ' + shortDate(P.start) + ' \u2013 ' + shortDate(P.end) + '</div>' +
      '<div class="cc-total"><span>' + (isRecv ? "Due this cutoff" : "To pay this cutoff") + '</span><b>' + peso(total) + '</b></div>' +
      (over.length ? '<div class="cc-total over"><span>Overdue</span><b>' + peso(overTotal) + '</b></div>' : '') +
      (rows ? '<div class="cc-list">' + rows + '</div>' : '<div class="cc-empty">Nothing due this cutoff.</div>') +
      '<div class="cc-month"><span>This month</span><b>' + peso(monthTotal) + '</b></div></div>';
  }
  // Collapse state, saved per share link.
  function openKey() { return "sharedOpen::" + (data && (data.shareId || data.person) || "x"); }
  function loadOpen() { try { return JSON.parse(localStorage.getItem(openKey()) || "{}") || {}; } catch (e) { return {}; } }
  function saveOpen(m) { try { localStorage.setItem(openKey(), JSON.stringify(m)); } catch (e) {} }

  let data = null;
  let viewMonth = monthKey(new Date());

  function decode() {
    const h = location.hash.replace(/^#/, "");
    if (!h) return null;
    try {
      const json = decodeURIComponent(escape(atob(h)));
      const p = JSON.parse(json);
      if (p && Array.isArray(p.items)) return p;
    } catch (e) {}
    return null;
  }

  function render() {
    const app = document.getElementById("app");
    if (!data) {
      app.innerHTML = '<div class="err">Invalid or empty share link. Please ask for a new link.</div>';
      return;
    }
    const items = data.items;
    const isRecv = (data.kind === "receivable");
    const capText = isRecv ? "Amount owed by" : "Debt summary for";
    const defLabel = isRecv ? "Item" : "Debt";
    const emptyText = isRecv ? "Nothing owed for this month." : "No debts for this month.";
    const noteTitle = isRecv ? "Note to lender" : "Note to owner";
    const notePlaceholder = isRecv
      ? "Write a note here (e.g. I already paid this, or when you can pay)..."
      : "Write a note here (e.g. I already paid this month, or a reminder)...";
    const footText = isRecv ? "Personal use only &bull; read-only &bull; only your balance is shown here"
                            : "Personal use only &bull; read-only &bull; no other debts are shown here";

    // summary (this month + overall)
    let monthDue=0, monthPaid=0, totalRemaining=0, owed=0, paid=0;
    items.forEach(it => {
      owed += num(it.amount); paid += paidOf(it); totalRemaining += remainingOf(it);
      if (isActiveIn(it, viewMonth)) {
        const due = perTermOf(it); // plan-aware this-month amount
        monthDue += due;
        if (isPaidThisMonth(it, viewMonth)) monthPaid += due;
      }
    });

    // group active-this-month items by sub-category (unpaid first by due date, paid collapsed at the bottom)
    const active = items.filter(it => isActiveIn(it, viewMonth));
    const openMap = loadOpen();
    let boxes = "";
    if (active.length) {
      const bySub = {};
      active.forEach(it => { const s = it.subCat || "other"; (bySub[s]=bySub[s]||[]).push(it); });
      Object.keys(bySub).forEach(sub => {
        const list = bySub[sub].map(it => ({ it: it, idx: items.indexOf(it), paid: isPaidThisMonth(it, viewMonth), due: itemDueIso(it, viewMonth) }));
        const cmp = (x, y) => (x.due || "9999") < (y.due || "9999") ? -1 : (x.due || "9999") > (y.due || "9999") ? 1 : x.idx - y.idx;
        const unpaidL = list.filter(x => !x.paid).sort(cmp), paidL = list.filter(x => x.paid).sort(cmp);
        const due = list.reduce((s,x)=> s + perTermOf(x.it), 0);
        const rowOf = (x) => {
          const it = x.it, paidNow = x.paid;
          const dt = it.date ? new Date(it.date+"T00:00:00").toLocaleDateString("en-PH",{year:"2-digit",month:"short",day:"numeric"}) : "";
          const label = esc((it.name && it.name.trim()) ? it.name : defLabel);
          const amt = perTermOf(it);
          let termTag = "";
          if (hasPlan(it)) {
            const es = planEntriesFor(it, viewMonth);
            const labels = es.map(p => { const which = it.plan.findIndex(x=>x===p)+1; return "split "+which+"/"+it.plan.length+" \u00b7 "+monthLabel(p.key).split(" ")[0]+" "+p.payday; });
            termTag = ' <span class="bd-term">' + labels.join(", ") + '</span>';
          } else if (it.terms>1){ const i=termIndexFor(it,viewMonth); termTag=' <span class="bd-term">'+(i+1)+'/'+it.terms+'</span>'; }
          let dueTag = "";
          if (!hasPlan(it) && it.dueDay && it.dueDay>=1 && it.dueDay<=31){
            dueTag = ' <span class="due-tag">\uD83D\uDCC5 '+it.dueDay+' ('+cutoffForDueDay(it.dueDay)+')</span>';
          }
          let subHtml = "", hasSub = false;
          if (Array.isArray(it.lineItems) && it.lineItems.length) {
            hasSub = true;
            subHtml = it.lineItems.map(li => '<div class="bd-row bd-subrow">' +
              '<span class="bd-label">\u21B3 '+esc(li.label||"Item")+'</span>' +
              '<span class="bd-amt">'+peso(num(li.price))+'</span></div>').join("");
          }
          const k = "i" + x.idx, isOpen = !!openMap[k];
          return '<div class="bd-row'+(paidNow?' bd-paid':'')+(hasSub?' has-sub':'')+'"'+(hasSub?' data-tg="'+k+'" role="button" tabindex="0"':'')+'>' +
            (hasSub ? '<span class="chev" data-chev="'+k+'">'+(isOpen?'\u25BE':'\u25B8')+'</span>' : '') +
            '<span class="bd-dot'+(paidNow?' on':'')+'">'+(paidNow?'\u2713':'')+'</span>' +
            '<span class="bd-label">'+label+termTag+dueTag+(dt?' <span class="bd-date">'+dt+'</span>':'')+'</span>' +
            '<span class="bd-amt">'+peso(amt)+'</span></div>' +
            (hasSub ? '<div class="sub-wrap" data-body="'+k+'" style="display:'+(isOpen?'block':'none')+'">'+subHtml+'</div>' : '');
        };
        let rows = unpaidL.map(rowOf).join("");
        if (paidL.length) {
          const pk = ("p_" + sub + "_" + viewMonth).replace(/[^\w-]/g, "_"), pOpen = !!openMap[pk];
          const pTot = paidL.reduce((s,x)=> s + perTermOf(x.it), 0);
          rows += '<div class="bd-row paid-head" data-tg="'+pk+'" role="button" tabindex="0"><span class="chev" data-chev="'+pk+'">'+(pOpen?'\u25BE':'\u25B8')+'</span>' +
            '<span class="bd-label">Paid ('+paidL.length+')</span><span class="bd-amt">'+peso(pTot)+'</span></div>' +
            '<div class="sub-wrap" data-body="'+pk+'" style="display:'+(pOpen?'block':'none')+'">'+paidL.map(rowOf).join("")+'</div>';
        }
        boxes += '<div class="sub-box"><div class="sub-box-head"><span>'+esc(subLabel(sub))+'</span><span>'+peso(due)+'</span></div>'+rows+'</div>';
      });
    } else {
      boxes = '<div class="sub-box"><div class="bd-row">' + emptyText + '</div></div>';
    }

    const paidOff = totalRemaining <= 0.009;
    app.innerHTML =
      '<div class="hero"><div class="cap">' + capText + '</div>' +
        '<div class="who">' + (data.person || "You") + '</div>' +
        '<div class="made">Shared ' + (data.madeAt || "") + ' &bull; read-only snapshot</div></div>' +
      '<div class="month-bar"><button id="pm">&#8249;</button><div class="m-label">' + monthLabel(viewMonth) + '</div><button id="nm">&#8250;</button></div>' +
      '<div class="summary">' +
        '<div class="srow"><div class="lbl">Due this month</div><div class="val owed big">' + peso(monthDue) + '</div></div>' +
        '<div class="srow"><div class="lbl">Paid this month</div><div class="val paid">' + peso(monthPaid) + '</div></div>' +
        '<div class="srow"><div class="lbl">Total remaining (all)</div><div class="val owed">' + peso(totalRemaining) + '</div></div>' +
      '</div>' +
      '<div class="debt-item' + (paidOff ? " paid-off" : "") + '">' +
        '<div class="d-amounts">' +
          '<div class="seg"><div class="k">Total owed</div><div class="v">' + peso(owed) + '</div></div>' +
          '<div class="seg"><div class="k">Paid</div><div class="v paid">' + peso(paid) + '</div></div>' +
          '<div class="seg"><div class="k">Remaining</div><div class="v owed">' + peso(totalRemaining) + '</div></div>' +
        '</div>' + cutoffCardHtml(isRecv) + boxes +
      '</div>' +
      '<div class="card"><h2>' + noteTitle + '</h2>' +
        '<textarea class="note-box" id="noteBox" placeholder="' + notePlaceholder + '"></textarea>' +
        '<button class="send-btn" id="sendNote">Submit note</button>' +
        '<div class="note-hint" id="noteStatus">' + (data.shareId ? "Your note goes directly to the owner (cloud sync)." : "Note mode: saved on this device only (no reply channel on this link).") + '</div>' +
      '</div>' +
      '<div class="foot">' + footText + '</div>';

    document.querySelectorAll("[data-tg]").forEach(el => {
      const toggle = () => {
        const k = el.getAttribute("data-tg"), m = loadOpen(), open = !m[k];
        if (open) m[k] = 1; else delete m[k];
        saveOpen(m);
        document.querySelectorAll('[data-body="' + k + '"]').forEach(b => { b.style.display = open ? "block" : "none"; });
        document.querySelectorAll('[data-chev="' + k + '"]').forEach(c => { c.textContent = open ? "\u25BE" : "\u25B8"; });
      };
      el.onclick = toggle;
      el.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    });
    document.getElementById("pm").onclick = () => { viewMonth = addMonths(viewMonth, -1); render(); };
    document.getElementById("nm").onclick = () => { viewMonth = addMonths(viewMonth, 1); render(); };

    // Note channel: Firebase two-way if shareId present, else local-only fallback.
    const nb = document.getElementById("noteBox");
    const status = document.getElementById("noteStatus");
    const sendBtn = document.getElementById("sendNote");
    const localKey = "sharedNote::" + (data.person || "x");

    if (data.shareId && fbDb) {
      const ref = fbDb.ref("shares/" + data.shareId + "/reply");
      // load current value once; keep editing area in sync if empty
      ref.once("value").then(snap => {
        const v = snap.val();
        if (v && typeof v.note === "string" && !nb.value) nb.value = v.note;
      }).catch(() => {});
      sendBtn.onclick = () => {
        const note = nb.value.trim();
        status.textContent = "Sending\u2026";
        ref.set({ note: note, updatedAt: Date.now() })
          .then(() => { status.textContent = "\u2705 Sent to the owner! (" + new Date().toLocaleTimeString() + ")"; })
          .catch(() => { status.textContent = "\u26A0\uFE0F Not sent (no internet?). Please try again."; });
      };
    } else {
      // fallback: local only
      try { nb.value = localStorage.getItem(localKey) || ""; } catch (e) {}
      sendBtn.onclick = () => {
        try { localStorage.setItem(localKey, nb.value); } catch (e) {}
        status.textContent = "Saved on this device (no cloud channel on this link).";
      };
    }
  }

  // Firebase (same project as the owner) for the note reply channel.
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyATaU8PnQwkMRvf6_j6Ccp1j0Qz8oeyELI",
    authDomain: "crypto-tracker-bfefb.firebaseapp.com",
    databaseURL: "https://crypto-tracker-bfefb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "crypto-tracker-bfefb",
    storageBucket: "crypto-tracker-bfefb.firebasestorage.app",
    messagingSenderId: "901782471631",
    appId: "1:901782471631:web:5c7ec398e607b1777548ba"
  };
  let fbDb = null;
  try {
    if (typeof firebase !== "undefined") {
      if (!firebase.apps || !firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      fbDb = firebase.database();
    }
  } catch (e) { fbDb = null; }

  // A legacy base64 payload is long and contains JSON chars; a shareId is short/alphanumeric.
  function looksLikeShareId(h) { return /^[a-z0-9]{6,24}$/i.test(h); }

  function applyData(p) {
    data = p;
    if (data && Array.isArray(data.items) && data.items.length) {
      const starts = data.items.map(i => i.startMonth).filter(Boolean).sort();
      if (starts.length && starts[0] > viewMonth) viewMonth = starts[0];
    }
    render();
  }

  function loadFromHash() {
    const h = location.hash.replace(/^#/, "");
    if (!h) { applyData(null); return; }

    if (looksLikeShareId(h) && fbDb) {
      // SHORT LINK: fetch the snapshot from Firebase, then keep it updated live.
      const app = document.getElementById("app");
      app.innerHTML = '<div class="err">Loading\u2026</div>';
      fbDb.ref("shares/" + h + "/data").on("value", (snap) => {
        const p = snap.val();
        if (p && Array.isArray(p.items)) { p.shareId = h; applyData(p); }
        else { applyData(null); }
      }, () => applyData(null));
      return;
    }
    // LEGACY: base64 payload embedded in the hash
    applyData(decode());
  }

  loadFromHash();
  window.addEventListener("hashchange", loadFromHash);
</script>
</body>
</html>
